# Setup
config-version = 2
start-at-login = true

# Borders
after-startup-command = ['exec-and-forget borders active_color=0xff98E8DE inactive_color=0x50FFFFFF width=8.0']

[mode.main.binding]
# Workspaces
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'

# Flytta fönster till workspace
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'

# Flytta fokus mellan fönster
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Byt ordning på fönster
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Stäng fokuserat fonster
alt-q = 'close'

# Toggla layout
alt-r = 'layout tiles horizontal vertical'

# Tillåt flytande fönster
alt-f = 'layout floating tiling'

# Maximera fokuserat fönster (toggle)
alt-shift-f = 'fullscreen'

# Resizea fönster
alt-comma = 'resize smart -250'
alt-period = 'resize smart +250'

# Andra kommandon
alt-enter = 'exec-and-forget /Users/alwinsjostrom/Applications/ghostty.app/Contents/MacOS/ghostty'

# Workspaces
[workspace-to-monitor-force-assignment]
1 = 1 # P27h-20 (V)
2 = 2 # P27h-20 (V)
# 3 = 3 # Laptop

# Flytta fönster automatiskt
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

# [[on-window-detected]]
# if.app-id = 'md.obsidian'
# run = 'move-node-to-workspace 2'

# Utseende
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8
