# Setup
config-version = 2
start-at-login = true

# Borders
after-startup-command = ['exec-and-forget borders active_color=0xff98E8DE inactive_color=0x50FFFFFF width=8.0']

[mode.main.binding]
# Workspaces
ctrl-1 = 'workspace 1'
ctrl-2 = 'workspace 2'

# Move window to workspace
ctrl-shift-1 = 'move-node-to-workspace 1'
ctrl-shift-2 = 'move-node-to-workspace 2'

# Move focus between windows
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'

# Rearrange windows
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'

# Close focused window
alt-q = 'close'

# Toggle layout
alt-r = 'layout tiles horizontal vertical'

# Allow floating windows
alt-f = 'layout floating tiling'

# Maximize focused window (toggle)
alt-shift-f = 'fullscreen'

# Resize windows
alt-comma = 'resize smart -250'
alt-period = 'resize smart +250'

# Other commands
alt-enter = 'exec-and-forget /Users/alwinsjostrom/Applications/ghostty.app/Contents/MacOS/ghostty'

# Workspaces
[workspace-to-monitor-force-assignment]
1 = 1 # P27h-20 (V)
2 = 2 # P27h-20 (V)
# 3 = 3 # Laptop

# Move windows automatically
[[on-window-detected]]
if.app-id = 'com.google.Chrome'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 2'

# [[on-window-detected]]
# if.app-id = 'md.obsidian'
# run = 'move-node-to-workspace 2'

# Appearance
[gaps]
inner.horizontal = 8
inner.vertical = 8
outer.left = 8
outer.bottom = 8
outer.top = 8
outer.right = 8
